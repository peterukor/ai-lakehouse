services:
  rustfs:
    image: rustfs/rustfs:latest
    mem_limit: 1g       # small on purpose -- we're on an 8GB laptop, keep containers lean
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      # Named volumes instead of bind mounts: Docker creates and owns this storage
      # entirely inside its own Linux VM, so macOS's file permission system and the
      # UID translation across the host<->VM bridge are never involved. See README
      # for the full story on why we landed here.
      - rustfs-data:/data
      - rustfs-logs:/logs

  lab:
    image: python:3.12-slim
    mem_limit: 2g
    working_dir: /workspace
    depends_on: [rustfs]
    volumes:
      - ./:/workspace
      - ./local-store:/data/local
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      S3_ENDPOINT: "http://rustfs:9000"
      HF_TOKEN: ${HF_TOKEN:-}
    command: sleep infinity

volumes:
  rustfs-data:
  rustfs-logs:
  